services:
  web:
    build:
      context: ./web
    container_name: accessibility_web
    # Compile catalogs hidden by the source bind mount before serving requests.
    command:
      - sh
      - -c
      - >-
        pybabel compile -d /app/translations &&
        exec gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4
        --timeout 60 main:app
    restart: unless-stopped
    ports:
      - "80:5000"
    env_file:
      - .env
    volumes:
      - ./web/app:/app
      - ./results:/results
      - ./data:/data
      - ./datasets:/datasets
    depends_on:
      - db
      - evaluator
      - dataset-server
      - qdrant
    networks:
      - accessibility_net

  worker:
    build:
      context: ./web
    container_name: accessibility_worker
    command: ["python", "worker.py"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./web/app:/app
      - ./results:/results
      - ./data:/data
      - ./datasets:/datasets
    depends_on:
      - db
      - evaluator
      - dataset-server
      - qdrant
    networks:
      - accessibility_net

  evaluator:
    init: true
    build:
      context: ./evaluator
    container_name: accessibility_evaluator
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./results:/results
      - ./data:/data
    networks:
      - accessibility_net

  dataset-server:
    build:
      context: ./dataset_server
    container_name: accessibility_dataset_server
    restart: unless-stopped
    volumes:
      - ./datasets:/datasets:ro
    networks:
      - accessibility_net

  db:
    image: mysql:8.0
    container_name: accessibility_db
    restart: always
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - accessibility_net

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: accessibility_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - accessibility_net

volumes:
  mysql_data:
  qdrant_data:

networks:
  accessibility_net:
    driver: bridge
