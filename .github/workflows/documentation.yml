name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/tools/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/documentation.yml'
      - 'web/app/**'
      - 'evaluator/**'
      - 'browser_extension/**'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/tools/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/documentation.yml'
      - 'web/app/**'
      - 'evaluator/**'
      - 'browser_extension/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tooling
        run: python -m pip install -r requirements-docs.txt
      - name: Verify examples and source references
        run: python docs/tools/check_examples.py
      - name: Build documentation
        run: mkdocs build --strict
      - name: Verify generated links and search
        run: python docs/tools/check_site.py
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload documentation only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
